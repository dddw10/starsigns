# 仅为模板；现有非空卷必须先备份并建用户，见 docs/operations/deployment.md。
services:
  mongodb:
    image: mongo:7
    container_name: fortune-mongodb
    volumes:
      - mongodb_data:/data/db
      - ./server/scripts/init-mongo-user.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_APP_DATABASE:?Set MONGO_APP_DATABASE to the existing database name}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    command: ["mongod", "--auth"]

  redis:
    image: redis:7-alpine
    container_name: fortune-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fortune-server
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ${DEPLOY_ENV_FILE:-./server/.env.production}
    environment:
      - NODE_ENV=production
      # 容器内监听所有接口，宿主只发布到 127.0.0.1。
      - BIND_HOST=0.0.0.0
      # env_file 供应用配置使用；显式屏蔽基础设施管理员凭据。
      - MONGO_ROOT_USERNAME=
      - MONGO_ROOT_PASSWORD=
      - MONGO_INITDB_ROOT_USERNAME=
      - MONGO_INITDB_ROOT_PASSWORD=
      - MONGODB_URI=mongodb://${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_APP_DATABASE:?Set MONGO_APP_DATABASE}?authSource=${MONGO_APP_DATABASE:?Set MONGO_APP_DATABASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - TZ=Asia/Shanghai
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
